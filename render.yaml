services:
  - type: web
    name: lucky-fest
    env: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    autoDeploy: true
    envVars:
      - key: BOT_TOKEN
        sync: false
      - key: WEB_APP_URL
        sync: false
      - key: MONGODB_URI
        sync: false
      - key: BOT_USERNAME
        sync: false
      - key: BOT_NAME
        value: Lucky Fest
      - key: ADMIN_CHAT_ID
        sync: false
      - key: CHANNEL_USERNAME
        value: Lucky_Fest_Official
      - key: CHANNEL_URL
        value: https://t.me/Lucky_Fest_Official
      - key: TOPUP_WALLET
        value: UQCzzBp_io5zdMiOCMykYY7HzUFkhRqST-xMWvr_DzSScooi
      - key: MIN_WITHDRAW_USDT
        value: "1"
      - key: MINING_DAILY_RATE
        value: "0.027"
