<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>Lucky Fest</title>
<link rel="stylesheet" href="style.css" />
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script src="https://unpkg.com/@tonconnect/ui@2/dist/tonconnect-ui.min.js"></script>
</head>
<body>
  <div id="app">
    <header class="topbar">
      <div class="brand">
        <span class="brand-mark">🎁</span>
        <span class="brand-name" data-i18n="app_title">Lucky Fest</span>
      </div>
      <div class="stats">
        <span class="pill" id="levelPill">Lv. 1</span>
        <span class="pill pill-gold" id="xpPill"><img src="assets/ui/xp_gem.png" class="pill-icon"/> 0 XP</span>
      </div>
    </header>

    <main id="view"></main>

    <nav class="tabbar">
      <button class="tab active" data-tab="merge">
        <span class="tab-icon">🧩</span><span data-i18n="tab_merge">Merge</span>
      </button>
      <button class="tab" data-tab="tasks">
        <span class="tab-icon">✅</span><span data-i18n="tab_tasks">Tasks</span>
      </button>
      <button class="tab" data-tab="roadmap">
        <span class="tab-icon">🎄</span><span data-i18n="tab_roadmap">Roadmap</span>
      </button>
      <button class="tab" data-tab="raffles">
        <span class="tab-icon">🎟️</span><span data-i18n="tab_raffles">Raffles</span>
      </button>
      <button class="tab" data-tab="wallet">
        <span class="tab-icon">👛</span><span data-i18n="tab_wallet">Wallet</span>
      </button>
      <button class="tab" data-tab="admin" id="adminTabBtn" style="display:none;">
        <span class="tab-icon">🎛️</span><span>Admin</span>
      </button>
    </nav>
  </div>

  <script src="app.js"></script>
</body>
</html>
