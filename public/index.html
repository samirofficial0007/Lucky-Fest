<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
  <title>NOVUM.AI Agent</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <div id="app">
    <header class="topbar">
      <button id="closeBtn" class="pill anim-btn" type="button">✕ Close</button>
      <div class="online"><span class="dot"></span> <span id="onlineCount">0 online</span></div>
      <button class="circle-btn anim-btn" id="menuBtn" type="button">⋮</button>
    </header>

    <main id="content" class="page-enter"></main>

    <div id="toast"></div>
    <div id="floatNotif" class="float-notif"></div>

    <nav class="bottom-nav">
      <button data-page="trade" class="anim-btn" type="button">⇄<small>Trade</small></button>
      <button data-page="friends" class="anim-btn" type="button">👥<small>Friends</small></button>
      <button data-page="farm" class="anim-btn" type="button">$<small>Farm</small></button>
      <button data-page="gifts" class="anim-btn" type="button">🎁<small>Gifts</small></button>
      <button data-page="account" class="anim-btn" type="button">👤<small>Account</small></button>
    </nav>
  </div>
  <script src="/app.js"></script>
</body>
</html>
